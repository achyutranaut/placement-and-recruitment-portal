name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Build (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          mvn clean test --batch-mode

      - name: Package Spring Boot Application
        run: |
          cd backend
          mvn package -DskipTests --batch-mode

  frontend-build:
    name: Frontend Build (React 19 / Vite / Tailwind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline || npm install

      - name: Run Frontend Production Build
        run: |
          cd frontend
          npm run build
