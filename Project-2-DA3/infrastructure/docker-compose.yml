services:
  # Oracle Database 23ai Free (Authoritative DB Engine for DA2)
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: portal-oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OraclePassword123!}
      APP_USER: ${ORACLE_USER:-placement_app}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-OraclePassword123!}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - portal-net

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: portal-redis
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec redis-server --requirepass \"$${REDIS_PASSWORD}\"; else exec redis-server; fi"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - portal-net

  # Neo4j Graph Database (Dual-Engine Graph Projection for DA3)
  neo4j:
    image: neo4j:5.26.0
    container_name: portal-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser / HTTP API
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/placement2026}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - portal-net

  # Qdrant Vector Database (Vector Search Engine for Semantic Recruitment Retrieval)
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: portal-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - portal-net

  # Spring Boot 3.4 Modular Monolith Backend
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: portal-backend
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${ORACLE_USER:-placement_app}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_PASSWORD:-OraclePassword123!}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PORTAL_JWT_SECRET: ${JWT_SECRET:-}
      PORTAL_JWT_EXPIRATION_MS: 86400000
      PORTAL_NEO4J_ENABLED: ${PORTAL_NEO4J_ENABLED:-true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-placement2026}
      PORTAL_QDRANT_ENABLED: ${PORTAL_QDRANT_ENABLED:-true}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-placement-semantic-search}
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal-net

  # Vite React 19 Frontend
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: portal-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portal-net

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: portal-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - portal-net

networks:
  portal-net:
    driver: bridge

volumes:
  oracle_data:
  redis_data:
  neo4j-data:
    name: portal-neo4j-data
  qdrant-data:
    name: portal-qdrant-data
